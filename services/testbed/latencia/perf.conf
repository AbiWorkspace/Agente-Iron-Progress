[Service]
# ---------------------------------------------------------------------------
# Iron Progress — Fase 1 de optimizacion de latencia (2026-07-28)
# Modelo: qwen3.6:27b (27.3B denso, hibrido recurrente) en RX 7900 XTX 24 GB.
# Baseline medido antes de este cambio: 8.9-9.1 s de reprefill POR LLAMADA.
# ---------------------------------------------------------------------------

Environment="OLLAMA_FLASH_ATTENTION=1"
Environment="OLLAMA_KEEP_ALIVE=15m"
Environment="OLLAMA_MAX_LOADED_MODELS=2"

# KV f16 en lugar de q8_0: el KV de este modelo pesa solo 544 MiB @16k porque
# casi todas las capas son recurrentes, no de atencion. Cuantizarlo no ahorra
# VRAM relevante y el kernel de flash-attn con KV cuantizado cuesta decode en
# ROCm. Sube a ~1.05 GB; hay 4.9 GB de VRAM libres.
Environment="OLLAMA_KV_CACHE_TYPE=f16"

# --- Checkpoints de estado recurrente (LA optimizacion de esta fase) ---------
# Este modelo es hibrido recurrente: el estado NO se restaura token a token como
# un KV cache normal, solo desde checkpoints completos de 149.6 MiB.
# El default --checkpoint-min-step es 8192 tokens, asi que solo existia UN
# checkpoint por prompt (siempre en la posicion 8518) y cada llamada
# reprocesaba ~6.900 tokens ya validos:
#   "checking checkpoint with [8518, 8518] against 15459" -> 6944 tok / 8.93 s
# Con espaciado de 2048 hay ~8 checkpoints repartidos por el contexto de 16k y
# el reprefill queda acotado a <2048 tokens (~2.7 s).
Environment="LLAMA_ARG_CHECKPOINT_MIN_SPACING_NT=2048"
Environment="LLAMA_ARG_CTX_CHECKPOINTS=8"

# Techo de la cache de prompts. Baja de 8192 (default) a 3072 MiB a proposito:
# mas checkpoints por prompt = cada prompt ocupa mas, y esta maquina solo tiene
# 15 GB de RAM con ~2.9 GB disponibles y 2.5 GB ya en zram. Preferimos 2-3
# prompts bien checkpointeados a 6 mal checkpointeados.
Environment="LLAMA_ARG_CACHE_RAM=3072"

# Prefill: Ollama lanza llama-server con -b 1024 -ub 1024. A 2048 el prefill
# sube ~20% a cambio de ~275 MiB extra de compute buffer en VRAM.
Environment="LLAMA_ARG_BATCH=2048"
Environment="LLAMA_ARG_UBATCH=2048"
